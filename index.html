<body>
<div id="app"></div>
<script>
var SUBS=["Signals & Systems","Digital Electronics","Analog Electronics","Communication Systems","VLSI Design","Microprocessors & Microcontrollers","Control Systems","Electromagnetic Field Theory","Digital Signal Processing","Embedded Systems & IoT"];
var DEGS=["B.E. / B.Tech (Electronics & Communication)","M.E. / M.Tech (Electronics)","M.E. / M.Tech (Communication)","M.E. / M.Tech (VLSI Design)","M.E. / M.Tech (Embedded Systems)","Ph.D. (Electronics)","Ph.D. (Communication)","Ph.D. (Signal Processing)","Other"];
var STORE_KEY='kle_ece_admin';
var BASE_URL=window.location.origin+window.location.pathname;

// State
var phase='boot', apiKey='', candName='', sub='';
var qA=[], qBC=[], cq=0, selOpt=null;
var aA=[], aBC=[], rep=null, tmr=null, tv=60, scA=0;

// ── Crypto utils ──
function xorEnc(text,key){var r='';for(var i=0;i<text.length;i++)r+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));return btoa(r).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
function xorDec(enc,key){var b=enc.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var text=atob(b),r='';for(var i=0;i<text.length;i++)r+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));return r;}
function simpleHash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return Math.abs(h).toString(16);}
function makeToken(key,name){var sk=Math.random().toString(36).substring(2)+Math.random().toString(36).substring(2);sk=sk.substring(0,20);var payload=JSON.stringify({k:key,n:name,exp:Date.now()+(2*60*60*1000),iss:Date.now()});var enc=xorEnc(payload,sk);return xorEnc(sk+'~'+enc,'KLE-ECE-APP-2026');}
function parseToken(token){try{var combined=xorDec(token,'KLE-ECE-APP-2026');var idx=combined.indexOf('~');if(idx<0)return null;var sk=combined.substring(0,idx);var enc=combined.substring(idx+1);var payload=JSON.parse(xorDec(enc,sk));if(!payload.k||!payload.exp)return null;if(payload.exp<Date.now())return{expired:true};return payload;}catch(e){return null;}}

// ── Storage ──
function adminLoad(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{};}catch(e){return{};}}
function adminSave(data){localStorage.setItem(STORE_KEY,JSON.stringify(data));}

// ── Helpers ──
function xe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function so(s){return s.replace(/^[A-Da-d][\.\)]\s*/,'').trim();}
function pj(t){t=t.trim().replace(/^```[\w]*\n?/,'').replace(/\n?```$/,'').trim();var a=t.match(/\[[\s\S]*\]/);if(a)try{return JSON.parse(a[0]);}catch(e){}var o=t.match(/\{[\s\S]*\}/);if(o)try{return JSON.parse(o[0]);}catch(e){}return JSON.parse(t);}

// ── AI call ──
async function ai(prompt, maxTokens) {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: maxTokens || 4000,
            messages: [{ role: 'user', content: prompt }]
        })
    });
    if (!res.ok) {
        var errText = await res.text();
        throw new Error('API Error ' + res.status + ': ' + errText);
    }
    var d = await res.json();
    if (d.error) throw new Error(d.error.message);
    if (!d.content || !d.content[0]) throw new Error('Empty response from API');
    return d.content[0].text;
}

// ── Test API key ──
async function testApiKey(key) {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 10,
            messages: [{ role: 'user', content: 'say ok' }]
        })
    });
    var d = await res.json();
    if (d.error) throw new Error(d.error.message);
    return true;
}

// ── Question generation ──
async function doGenA() {
    try {
        var t = await ai(
            'Generate exactly 10 multiple-choice questions for an ECE faculty interview.\n' +
            'Topic: General Engineering for ECE — circuit theory, semiconductor devices, network theorems, engineering maths, signals basics.\n' +
            'Distribution: exactly 3 type "basic", 3 type "conceptual", 4 type "applied".\n' +
            'Rules: concept-level, no heavy calculations, 4 options prefixed A/B/C/D, one correct answer.\n' +
            'Return ONLY a valid JSON array, no markdown, no explanation:\n' +
            '[{"type":"basic","question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0}]',
            4000
        );
        qA = pj(t).map(function(q){ return Object.assign({},q,{part:'A'}); });
        cq=0; aA=[]; selOpt=null; phase='qA'; render();
    } catch(er) {
        rError('Part A Generation Failed', er.message, function(){ phase='candStart'; render(); });
    }
}

async function doGenBC() {
    try {
        var tb = await ai(
            'Generate exactly 10 multiple-choice questions for an ECE faculty interview.\n' +
            'Topic: '+sub+'\n' +
            'Distribution: exactly 3 type "basic", 3 type "conceptual", 4 type "applied".\n' +
            'Rules: concept-level, no heavy calculations, 4 options prefixed A/B/C/D.\n' +
            'Return ONLY a valid JSON array, no markdown:\n' +
            '[{"type":"basic","question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0}]',
            4000
        );
        var tc = await ai(
            'Generate exactly 5 aptitude MCQs for an ECE faculty interview.\n' +
            'Topic: Logical reasoning, analytical thinking, pattern recognition — minimal arithmetic.\n' +
            'Return ONLY a valid JSON array, no markdown:\n' +
            '[{"type":"aptitude","question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0}]',
            3000
        );
        qBC = pj(tb).map(function(q){ return Object.assign({},q,{part:'B'}); })
              .concat(pj(tc).map(function(q){ return Object.assign({},q,{part:'C'}); }));
        cq=0; aBC=[]; selOpt=null; phase='qBC'; render();
    } catch(er) {
        rError('Question Generation Failed', er.message, function(){ phase='subSel'; render(); });
    }
}

async function doGenRep() {
    try {
        var allQ=qA.concat(qBC), allA=aA.concat(aBC);
        var sA=qA.filter(function(q,i){return aA[i].s===q.correct;}).length;
        var sB=qBC.slice(0,10).filter(function(q,i){return aBC[i].s===q.correct;}).length;
        var sC=qBC.slice(10).filter(function(q,i){return aBC[i+10]&&aBC[i+10].s===q.correct;}).length;
        var tot=sA+sB+sC, avgT=Math.round(allA.reduce(function(a,x){return a+x.t;},0)/25), to=allA.filter(function(a){return a.s===null;}).length;
        var pf=allQ.map(function(q,i){return{part:q.part,type:q.type,q:q.question,given:allA[i].s!==null?so(q.options[allA[i].s]):'[timed out]',correct:so(q.options[q.correct]),ok:allA[i].s===q.correct,sec:allA[i].t};});
        var txt = await ai(
            'Senior ECE faculty evaluator at KLE Technological University.\n' +
            'CANDIDATE: '+candName+' | Part B Subject: '+sub+'\n' +
            'SCORES: A='+sA+'/10, B='+sB+'/10, C='+sC+'/5, Total='+tot+'/25, AvgTime='+avgT+'s, TimedOut='+to+'\n' +
            'RESPONSES: '+JSON.stringify(pf)+'\n' +
            'Return ONLY valid JSON:\n' +
            '{"executiveSummary":"2-3 sentences","partAAnalysis":"paragraph","partBAnalysis":"paragraph","partCAnalysis":"paragraph","timeManagement":"paragraph","strengths":["s1","s2","s3"],"gaps":["g1","g2","g3"],"mouldability":"Yes|Partially|No","mouldabilityReason":"explanation","month1":["a1","a2"],"month2":["a1","a2"],"month3":["a1","a2"],"recommendation":"Highly Recommended|Recommended|Recommended with Conditions|Not Recommended","recommendationReason":"justification"}',
            2500
        );
        rep = Object.assign({}, pj(txt), {sA:sA,sB:sB,sC:sC,total:tot,avgTime:avgT,timedOut:to});
        phase='report'; render();
    } catch(er) {
        rError('Report Generation Failed', er.message, null);
    }
}

// ── Timer ──
function startT(){clearInterval(tmr);tv=60;var el=document.getElementById('tv');if(el)el.textContent='60';setC(60);tmr=setInterval(function(){tv--;var e=document.getElementById('tv');if(e)e.textContent=tv;setC(tv);if(tv<=0){clearInterval(tmr);adv(null);}},1000);}
function setC(v){var r=document.getElementById('tring');if(!r)return;r.className='tring '+(v>30?'cg':v>10?'cy':'cr');}
function adv(s2){
    clearInterval(tmr);var spent=s2===null?60:Math.max(1,60-tv);selOpt=null;
    if(phase==='qA'){aA.push({s:s2,t:spent});if(aA.length>=qA.length){scA=qA.filter(function(q,i){return aA[i].s===q.correct;}).length;phase='aDone';render();}else{cq++;render();}}
    else if(phase==='qBC'){aBC.push({s:s2,t:spent});if(aBC.length>=qBC.length){phase='analyzing';render();doGenRep();}else{cq++;render();}}
}

// ── SCREENS ──

function rLanding(){
    document.getElementById('app').innerHTML=
    '<div class="page"><div class="card">'+
    '<div class="bnr"><div class="sub">KLE Technological University, Hubballi</div>'+

async function adminSubmit(){
    var data=adminLoad(), isSetup=!data.pwHash;
    var btn=document.getElementById('admin-btn');
    if(btn){btn.disabled=true;btn.textContent='Verifying…';}
    if(isSetup){
        var key=(document.getElementById('akey')||{}).value||'';
        var pw=(document.getElementById('apw')||{}).value||'';
        var pw2=(document.getElementById('apw2')||{}).value||'';
        if(!key||key.length<10){alert('Please enter a valid API key');if(btn){btn.disabled=false;btn.innerHTML='Test Key &amp; Save Setup';}return;}
        if(!pw||pw.length<4){alert('Password must be at least 4 characters');if(btn){btn.disabled=false;btn.innerHTML='Test Key &amp; Save Setup';}return;}
        if(pw!==pw2){alert('Passwords do not match');if(btn){btn.disabled=false;btn.innerHTML='Test Key &amp; Save Setup';}return;}
        // Test the API key first
        var tr=document.getElementById('test-result');
        if(tr)tr.innerHTML='<div class="info-box"><p>&#9201; Testing API key connection…</p></div>';
        try {
            apiKey=key;
            await testApiKey(key);
            if(tr)tr.innerHTML='<div class="test-ok">&#10003; API key is working correctly!</div>';
            data={pwHash:simpleHash(pw),apiKey:xorEnc(key,pw),links:[]};
            adminSave(data);
            setTimeout(function(){phase='admin';render();},800);
        } catch(er) {
            if(tr)tr.innerHTML='<div class="test-fail">&#10007; API key test failed: '+xe(er.message)+'<br><br>Please check your key from console.anthropic.com and try again.</div>';
            apiKey='';
            if(btn){btn.disabled=false;btn.innerHTML='Test Key &amp; Save Setup';}
        }
    } else {
        var pw=(document.getElementById('apw')||{}).value||'';
        if(simpleHash(pw)!==data.pwHash){
            alert('Incorrect password. Please try again.');
            if(btn){btn.disabled=false;btn.textContent='Login →';}
            return;
        }
        apiKey=xorDec(data.apiKey,pw);
        phase='admin';render();
    }
}

function dlPDF(){
    var r=rep,dt=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    var P=window.jspdf.jsPDF,doc=new P(),W=210,M=18,CW=W-M*2,y=15;
    function ft(s,x,yy,sz,b,cl,al){doc.setFontSize(sz||10);doc.setFont('helvetica',b?'bold':'normal');doc.setTextColor.apply(doc,cl||[40,40,40]);al==='center'?doc.text(s,W/2,yy,{align:'center'}):doc.text(s,x,yy);}
    function wp(t,x,yy,mw){doc.splitTextToSize(t,mw).forEach(function(l){if(yy>268){doc.addPage();yy=20;}ft(l,x,yy,9.5,false,[80,80,80]);yy+=5;});return yy;}
    function sh(ti,yy){doc.setFillColor(4,44,83);doc.rect(M,yy-4,CW,7,'F');ft(ti,M+2,yy+.5,9.5,true,[255,255,255]);return yy+7;}
    doc.setFillColor(4,44,83);doc.rect(0,0,W,30,'F');doc.setFillColor(186,117,23);doc.rect(0,28,W,2.5,'F');
    ft('KLE TECHNOLOGICAL UNIVERSITY, HUBBALLI',W/2,10,9.5,true,[250,199,117],'center');
    ft('Dept. of Electronics & Communication Engineering',W/2,17,9,false,[176,196,222],'center');
    ft('Faculty Technical Interview — Evaluation Report  ·  Confidential',W/2,24,8,false,[176,196,222],'center');
    y=38;y=sh('CANDIDATE INFORMATION',y)+4;
    [['Name',candName],['Part B Subject',sub],['Interview Date',dt]].forEach(function(kv){ft(kv[0]+':',M,y,9,true,[80,80,80]);ft(kv[1],M+46,y,9);y+=5.5;});
    y+=4;y=sh('PERFORMANCE SCORES',y)+5;
    var cs=[M,M+62,M+98,M+130,M+160];
    ['Section','Max','Score','%','Level'].forEach(function(h,i){ft(h,cs[i],y,8.5,true,[80,80,80]);});
    doc.setDrawColor(200,200,200);doc.line(M,y+2,W-M,y+2);y+=6;
    function lv(s,m){var p=s/m;return p>=.8?'Excellent':p>=.6?'Good':p>=.4?'Average':'Needs Focus';}
    [['Part A: General Engineering','10',''+r.sA,r.sA*10+'%',lv(r.sA,10)],['Part B: '+sub.substring(0,18),'10',''+r.sB,r.sB*10+'%',lv(r.sB,10)],['Part C: Aptitude','5',''+r.sC,r.sC*20+'%',lv(r.sC,5)],['TOTAL','25',''+r.total,Math.round(r.total/25*100)+'%',lv(r.total,25)]].forEach(function(row,ri){if(ri===3){doc.setFillColor(240,244,248);doc.rect(M,y-3.5,CW,6,'F');}row.forEach(function(cell,ci){ft(cell,cs[ci],y,9,ri===3,ri===3?[4,44,83]:[50,50,50]);});y+=6.5;});
    ft('Avg time/question: '+r.avgTime+'s  ·  Timed out: '+r.timedOut+'/25',M,y+1,8,false,[120,120,120]);y+=9;
    if(y>240){doc.addPage();y=20;}y=sh('EXECUTIVE SUMMARY',y)+5;y=wp(r.executiveSummary,M,y,CW)+6;
    if(y>200){doc.addPage();y=20;}y=sh('PERFORMANCE ANALYSIS',y)+5;
    [['Part A — General Engineering:',r.partAAnalysis],['Part B — '+sub+':',r.partBAnalysis],['Part C — Aptitude:',r.partCAnalysis],['Time Management:',r.timeManagement]].forEach(function(pair){if(y>250){doc.addPage();y=20;}ft(pair[0],M,y,9,true,[4,44,83]);y+=5;y=wp(pair[1],M,y,CW)+4;});
    y+=2;if(y>200){doc.addPage();y=20;}y=sh('SKILLSET ANALYSIS',y)+5;
    ft('Strengths:',M,y,9,true);y+=5;r.strengths.forEach(function(s){ft('• '+s,M+3,y,9,false,[22,100,52]);y+=5;});
    y+=2;ft('Knowledge Gaps:',M,y,9,true);y+=5;r.gaps.forEach(function(g){ft('• '+g,M+3,y,9,false,[153,27,27]);y+=5;});
    y+=5;if(y>200){doc.addPage();y=20;}y=sh('MOULDABILITY & DEVELOPMENT PLAN',y)+5;
    var mc2={Yes:[22,100,52],Partially:[146,64,14],No:[153,27,27]}[r.mouldability]||[80,80,80];
    ft('Mouldability: '+r.mouldability,M,y,11,true,mc2);y+=7;y=wp(r.mouldabilityReason,M,y,CW)+5;
    if(r.mouldability!=='No'){ft('3-Month Development Plan:',M,y,9.5,true);y+=6;[['Month 1 — Priority:',r.month1,[4,44,83]],['Month 2 — Development:',r.month2,[12,68,124]],['Month 3 — Consolidation:',r.month3,[24,90,160]]].forEach(function(t2){if(y>250){doc.addPage();y=20;}ft(t2[0],M,y,9,true,t2[2]);y+=5;t2[1].forEach(function(it){ft('→ '+it,M+5,y,9);y+=4.8;});y+=3;});}
    y+=4;if(y>220){doc.addPage();y=20;}y=sh('OVERALL RECOMMENDATION',y)+5;
    var rc2={'Highly Recommended':[22,100,52],'Recommended':[3,105,161],'Recommended with Conditions':[186,117,23],'Not Recommended':[153,27,27]}[r.recommendation]||[80,80,80];
    ft(r.recommendation,M,y,12,true,rc2);y+=7;wp(r.recommendationReason,M,y,CW);
    var pg=doc.internal.getNumberOfPages();
    for(var p=1;p<=pg;p++){doc.setPage(p);doc.setFontSize(7.5);doc.setTextColor(155,155,155);doc.text('KLE Technological University — ECE Dept.  ·  Faculty Interview Report  ·  '+dt+'  ·  Page '+p+' of '+pg,W/2,292,{align:'center'});doc.setDrawColor(205,205,205);doc.line(M,288,W-M,288);}
    doc.save('KLE_ECE_'+candName.replace(/\s+/g,'_')+'_'+dt.replace(/[\s,]/g,'_')+'.pdf');
}

(function boot(){
    var params=new URLSearchParams(window.location.search);
    var t=params.get('t');
    if(t){
        var p=parseToken(t);
        if(!p){document.getElementById('app').innerHTML='<div class="page"><div class="card"><div class="bnr"><div class="sub">KLE Technological University</div><h1>Invalid Link</h1><p>This interview link is not valid</p></div><div class="bd"><div class="err-box"><p>This link is invalid or has been tampered with. Please ask your panelist for a new link.</p></div></div></div></div>';return;}
        if(p.expired){document.getElementById('app').innerHTML='<div class="page"><div class="card"><div class="bnr"><div class="sub">KLE Technological University</div><h1>Link Expired</h1><p>This interview link has expired</p></div><div class="bd"><div class="warn-box"><p>Interview links are valid for 2 hours. Please contact your panelist to generate a new link.</p></div></div></div></div>';return;}
        apiKey=p.k;candName=p.n||'';phase='candStart';
    } else {
        phase='landing';
    }
    render();
})();
